<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <title>
    YTM Lyrics
    </title>

    <style>

    /* ========================================
    整個視窗
    ======================================== */

    body {
        margin: 0;
        padding: 15px;
        font-family:
            "Microsoft JhengHei",
            sans-serif;
          background:
        rgba(0, 0, 0, var(--background-opacity));
        color: white;
        --background-opacity: 1;
    }

    /* ========================================
    歌詞
    ======================================== */

    #lyrics {
        margin-top: 15px;
        height: calc(100vh - 70px);
        overflow-y: auto;
        background: transparent;
    }

    /* 每一句歌詞 */
    #lyrics div {
        padding: 8px;
        margin: 4px 0;

        transition:
            color 0.2s,
            font-size 0.2s;
    }

    /* ========================================
    浮動視窗控制列
    ======================================== */
    #titleBar {

        padding: 10px;

        margin: -15px -15px 15px -15px;

        background: rgba(21, 21, 21, var(--background-opacity));

        cursor: move;

        user-select: none;

        font-weight: bold;
    }

    /* ========================================
   LRCLIB 候選歌詞選單
   ======================================== */
    #lyricCandidateSelect {

        display: none;

        margin-left: 10px;

        max-width: 260px;

        padding: 3px 6px;

        border-radius: 4px;

        border: 1px solid rgba(
            255,
            255,
            255,
            0.25
        );

        background: rgba(
            0,
            0,
            0,
            0.45
        );

        color: white;

        font-size: 12px;

        cursor: pointer;
    }

    /* ========================================
    下拉選單中的選項
    ======================================== */

    #lyricCandidateSelect option {

        background: #222;

        color: white;
    }
    </style>
</head>

<body>

<!-- ========================================
浮動視窗控制列
======================================== -->
<div id="titleBar">

    <span id="windowTitle">
        YTM Lyrics
    </span>

    <!-- ========================================
         LRCLIB 候選歌詞選單
         ========================================

         預設隱藏。

         只有目前歌曲存在多個 LRCLIB 候選時，
         lyrics.js 才會顯示這個選單。
    -->
    <select
        id="lyricCandidateSelect"
        title="選擇其他 LRCLIB 歌詞"
    >
    </select>

</div>
    
    
<!-- ========================================
歌詞
======================================== -->
    
<div id="lyrics"> 
    等待歌曲...
</div>


<script src="lyrics.js"></script>

</body>

</html>
