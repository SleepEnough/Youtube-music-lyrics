<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <title>
        YTM Lyrics
    </title>

    <style>

    /* ========================================
    整個視窗
    ======================================== */
    html,
    body {
        margin: 0;
        padding: 15px;

        width: 100%;
        height: 100%;
        box-sizing: border-box;

        font-family:
            "Microsoft JhengHei",
            sans-serif;

        background:
            rgba(0, 0, 0, var(--background-opacity));

        color: white;

        --background-opacity: 1;

        overflow: hidden;

        display: flex;
        flex-direction: column;
    }

    /* ========================================
    浮動視窗控制列
    ======================================== */
    #titleBar {
        display: none;

        padding: 10px;

        margin: -15px -15px 15px -15px;

        background:
            rgba(21, 21, 21, var(--background-opacity));

        cursor: move;

        user-select: none;

        font-weight: bold;
    }

    /* ========================================
    同步控制區
    ======================================== */
    #syncControls {

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 6px;

        padding: 6px 0;

        margin-bottom: 4px;

        user-select: none;

        opacity: 0.65;

        transition:
            opacity 0.2s ease;
    }

    #syncControls:hover {
        opacity: 1;
    }

    /* ========================================
    同步控制按鈕
    ======================================== */
    #syncControls button {

        padding: 5px 9px;

        border:
            1px solid rgba(
                255,
                255,
                255,
                0.12
            );

        border-radius: 6px;

        background:
            rgba(
                255,
                255,
                255,
                0.05
            );

        color:
            rgba(
                255,
                255,
                255,
                0.65
            );

        font-family: inherit;

        font-size: 12px;

        cursor: pointer;

        transition:
            background 0.15s ease,
            color 0.15s ease,
            border-color 0.15s ease,
            transform 0.1s ease;
    }

    #syncControls button:hover {

        background:
            rgba(
                255,
                255,
                255,
                0.11
            );

        color: white;

        border-color:
            rgba(
                255,
                255,
                255,
                0.22
            );
    }

    #syncControls button:active {

        background:
            rgba(
                255,
                255,
                255,
                0.16
            );

        transform: scale(0.96);
    }

    /* ========================================
    同步偏移文字
    ======================================== */
    #syncOffset {

        min-width: 82px;

        text-align: center;

        color:
            rgba(
                255,
                255,
                255,
                0.40
            );

        font-size: 12px;

        letter-spacing: 0.2px;
    }

    /* ========================================
    LRCLIB 候選歌詞選單
    ======================================== */
    #lyricCandidateSelect {

        display: none;

        margin: 2px auto 6px auto;

        max-width: 280px;

        padding: 5px 9px;

        border:
            1px solid rgba(
                255,
                255,
                255,
                0.12
            );

        border-radius: 6px;

        outline: none;

        background:
            rgba(
                255,
                255,
                255,
                0.05
            );

        color:
            rgba(
                255,
                255,
                255,
                0.75
            );

        font-family: inherit;

        font-size: 12px;

        cursor: pointer;

        transition:
            background 0.15s ease,
            border-color 0.15s ease;
    }

    #lyricCandidateSelect:hover {

        background:
            rgba(
                255,
                255,
                255,
                0.10
            );

        border-color:
            rgba(
                255,
                255,
                255,
                0.20
            );
    }

    /* ========================================
    下拉選單中的選項
    ======================================== */
    #lyricCandidateSelect option {

        background: #181818;

        color: white;
    }

    /* ========================================
    歌詞區域
    ======================================== */
    #lyrics {

        flex: 1;

        min-height: 0;

        margin-top: 4px;

        padding:
            40px 12px 120px 12px;

        overflow-y: auto;

        overflow-x: hidden;

        background: transparent;

        scroll-behavior: smooth;

        /*
        Firefox 隱藏捲軸
        */
        scrollbar-width: none;
    }

    /*
    Chrome / Edge / Safari 隱藏捲軸
    */
    #lyrics::-webkit-scrollbar {
        display: none;
    }

    /* ========================================
    一般歌詞
    ======================================== */
    #lyrics div {

        padding: 8px 12px;

        margin: 8px 0;

        color:
            rgba(
                255,
                255,
                255,
                0.30
            );

        font-size: 18px;

        font-weight: 400;

        line-height: 1.6;

        text-align: center;

        letter-spacing: 0.2px;

        opacity: 0.75;

        transform: scale(1);

        transition:
            color 0.35s ease,
            opacity 0.35s ease,
            transform 0.35s ease;
    }

    /* ========================================
    滑鼠移過歌詞
    ======================================== */
    #lyrics div:hover {

        color:
            rgba(
                255,
                255,
                255,
                0.60
            );

        cursor: pointer;
    }

    /* ========================================
    目前播放中的歌詞
    ======================================== */
    #lyrics div.current {

        color: white;

        opacity: 1;

        transform: scale(1.04);

        text-shadow:
            0 0 18px
            rgba(
                255,
                255,
                255,
                0.12
            );
    }

    /* ========================================
    等待歌曲
    ======================================== */
    #lyrics:empty::before {

        content: "等待歌曲...";

        display: block;

        margin-top: 100px;

        text-align: center;

        color:
            rgba(
                255,
                255,
                255,
                0.30
            );

        font-size: 16px;
    }

    </style>

</head>

<body>

    <!-- ========================================
    浮動視窗控制列
    ======================================== -->

    <!-- <div id="titleBar">

        <span id="windowTitle">
            YTM Lyrics
        </span>

    </div> -->

    <!-- ========================================
    同步控制
    ======================================== -->

    <div id="syncControls">
        <button
            id="syncMinus1"
            type="button"
        >
            -1.0s
        </button>

        <button id="syncMinus01" type="button">
            -0.1s
        </button>

        <span id="syncOffset">
            偏移：0.0s
        </span>

        <button id="syncPlus01" type="button">
            +0.1s
        </button>

        <button id="syncPlus1" type="button">
            +1.0s
        </button>

    </div>

    <!-- ========================================
    LRCLIB 候選歌詞選單
    ======================================== -->

    <div>
        <select
            id="lyricCandidateSelect"
            title="選擇其他 LRCLIB 歌詞"
        >
        </select>
    </div>

    <!-- ========================================
    歌詞
    ======================================== -->
    <div id="lyrics">
        等待歌曲...
    </div>

    <script src="lyrics.js"></script>
</body>
</html>
