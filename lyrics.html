<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <title>
        YTM Lyrics
    </title>

    <style>

    /* ========================================
    整個視窗
    ======================================== */
    html,
    body {
        margin: 0;
        padding: 15px;

        width: 100%;
        height: 100%;
        box-sizing: border-box;

        font-family:
            "Microsoft JhengHei",
            sans-serif;

        background:
            rgba(0, 0, 0, var(--background-opacity));

        color: white;

        --background-opacity: 1;

        overflow: hidden;

        display: flex;
        flex-direction: column;
    }

    /* ========================================
    浮動視窗控制列
    ======================================== */
    #titleBar {
        display: none;

        padding: 10px;

        margin: -15px -15px 15px -15px;

        background:
            rgba(
                21,
                21,
                21,
                var(--background-opacity)
            );

        cursor: move;

        user-select: none;

        font-weight: bold;
    }

    /* ========================================
    同步控制區
    ======================================== */
    #syncControls {

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 6px;

        padding: 6px 0;

        margin-bottom: 4px;

        user-select: none;

        opacity: 0.55;

        transition:
            opacity 0.25s ease;
    }

    #syncControls:hover {
        opacity: 1;
    }

    /* ========================================
    同步控制按鈕
    ======================================== */
    #syncControls button {

        padding: 5px 9px;

        border:
            1px solid
            rgba(
                255,
                255,
                255,
                0.10
            );

        border-radius: 6px;

        background:
            rgba(
                255,
                255,
                255,
                0.04
            );

        color:
            rgba(
                255,
                255,
                255,
                0.60
            );

        font-family: inherit;

        font-size: 12px;

        cursor: pointer;

        transition:
            background 0.15s ease,
            color 0.15s ease,
            border-color 0.15s ease,
            transform 0.1s ease;
    }

    #syncControls button:hover {

        background:
            rgba(
                255,
                255,
                255,
                0.10
            );

        color: white;

        border-color:
            rgba(
                255,
                255,
                255,
                0.20
            );
    }

    #syncControls button:active {

        background:
            rgba(
                255,
                255,
                255,
                0.16
            );

        transform: scale(0.96);
    }

    /* ========================================
    同步偏移文字
    ======================================== */
    #syncOffset {

        min-width: 82px;

        text-align: center;

        color:
            rgba(
                255,
                255,
                255,
                0.38
            );

        font-size: 12px;

        letter-spacing: 0.2px;
    }

    /* ========================================
    LRCLIB 候選歌詞選單
    ======================================== */
    #lyricCandidateSelect {

        display: none;

        margin: 2px auto 6px auto;

        max-width: 280px;

        padding: 5px 9px;

        border:
            1px solid
            rgba(
                255,
                255,
                255,
                0.10
            );

        border-radius: 6px;

        outline: none;

        background:
            rgba(
                255,
                255,
                255,
                0.04
            );

        color:
            rgba(
                255,
                255,
                255,
                0.70
            );

        font-family: inherit;

        font-size: 12px;

        cursor: pointer;

        transition:
            background 0.15s ease,
            border-color 0.15s ease;
    }

    #lyricCandidateSelect:hover {

        background:
            rgba(
                255,
                255,
                255,
                0.09
            );

        border-color:
            rgba(
                255,
                255,
                255,
                0.18
            );
    }

    /* ========================================
    下拉選單中的選項
    ======================================== */
    #lyricCandidateSelect option {

        background: #181818;

        color: white;
    }

    /* ========================================
    歌詞區域
    ======================================== */
    #lyrics {

        position: relative;

        flex: 1;

        min-height: 0;

        margin-top: 4px;

        padding:
            90px 12px 160px 12px;

        overflow-y: auto;

        overflow-x: hidden;

        background: transparent;

        scroll-behavior: smooth;

        /*
        Firefox
        */
        scrollbar-width: none;
    }

    /*
    Chrome / Edge / Safari
    */
    #lyrics::-webkit-scrollbar {
        display: none;
    }

    /* ========================================
    歌詞上方漸層遮罩
    ======================================== */
    #lyrics::before {

        content: "";

        position: fixed;

        top: 0;

        left: 0;

        right: 0;

        height: 90px;

        pointer-events: none;

        background:
            linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.65),
                rgba(0, 0, 0, 0)
            );

        z-index: 5;
    }

    /* ========================================
    歌詞下方漸層遮罩
    ======================================== */
    #lyrics::after {

        content: "";

        position: fixed;

        bottom: 0;

        left: 0;

        right: 0;

        height: 120px;

        pointer-events: none;

        background:
            linear-gradient(
                to top,
                rgba(0, 0, 0, 0.70),
                rgba(0, 0, 0, 0)
            );

        z-index: 5;
    }

    /* ========================================
    一般歌詞
    ======================================== */
    #lyrics div {

        padding:
            9px 14px;

        margin:
            12px 0;

        color:
            rgba(
                255,
                255,
                255,
                0.28
            );

        font-size: 18px;

        font-weight: 400;

        line-height: 1.6;

        text-align: center;

        letter-spacing: 0.25px;

        opacity: 0.68;

        transform:
            scale(1)
            translateY(0);

        filter:
            blur(0);

        transition:
            color 0.40s ease,
            opacity 0.40s ease,
            transform 0.40s ease,
            filter 0.40s ease;
    }

    /* ========================================
    目前播放中的歌詞
    ======================================== */
    #lyrics div.current {

        color: white;

        opacity: 1;

        transform:
            scale(1.045)
            translateY(-1px);

        filter:
            blur(0);

        text-shadow:
            0 0 20px
            rgba(
                255,
                255,
                255,
                0.14
            );
    }

    /* ========================================
    目前歌詞附近的視覺層級
    ======================================== */

    /*
    前後第一句
    */
    #lyrics div.lyric-near {

        color:
            rgba(
                255,
                255,
                255,
                0.50
            );

        opacity: 0.65;

        transform:
            scale(1.01);

        filter:
            blur(0);
    }


    /*
    前後第二句
    */
    #lyrics div.lyric-near-2 {

        color:
            rgba(
                255,
                255,
                255,
                0.32
            );

        opacity: 0.65;

        transform:
            scale(1);

        filter:
            blur(0);
    }


    /*
    距離目前歌詞三句以上
    */
    #lyrics div.lyric-far {

        color:
            rgba(
                255,
                255,
                255,
                0.2
            );

        opacity: 0.45;

        transform:
            scale(0.98);

        filter:
            blur(0.15px);
    }

    /* ========================================
    歌詞滑鼠移入
    ======================================== */
    #lyrics div:hover:not(.current) {

        color:
            rgba(
                255,
                255,
                255,
                0.58
            ) !important;

        opacity: 0.90 !important;

        transform:
            scale(1.02);

        cursor: pointer;
    }

    /* ========================================
    等待歌曲
    ======================================== */
    #lyrics:empty::before {

        content: "等待歌曲...";

        display: block;

        margin-top: 100px;

        text-align: center;

        color:
            rgba(
                255,
                255,
                255,
                0.30
            );

        font-size: 16px;
    }

    /* 一般歌詞：固定白色、不淡化、使用普通游標 */
    .plain-lyric,
    .plain-lyric.current,
    .plain-lyric.lyric-near,
    .plain-lyric.lyric-near-2,
    .plain-lyric.lyric-far {
        color: #ffffff !important;
        opacity: 1 !important;
        cursor: default !important;
    }

    /* 一般歌詞：滑鼠懸停時不改變外觀 */
    #lyrics div.plain-lyric:hover,
    #lyrics div.plain-lyric:hover:not(.current) {
        color: #ffffff !important;
        opacity: 1 !important;
        transform: none !important;
        cursor: default !important;
    }

    </style>


</head>

<body>

    <!-- ========================================
    浮動視窗控制列
    ======================================== -->

    <!-- <div id="titleBar">

        <span id="windowTitle">
            YTM Lyrics
        </span>

    </div> -->

    <!-- ========================================
    同步控制
    ======================================== -->

    <div id="syncControls">
        <button
            id="syncMinus1"
            type="button"
        >
            -1.0s
        </button>

        <button id="syncMinus01" type="button">
            -0.1s
        </button>

        <span id="syncOffset">
            偏移：0.0s
        </span>

        <button id="syncPlus01" type="button">
            +0.1s
        </button>

        <button id="syncPlus1" type="button">
            +1.0s
        </button>

    </div>

    <!-- ========================================
    LRCLIB 候選歌詞選單
    ======================================== -->

    <div>
        <select
            id="lyricCandidateSelect"
            title="選擇其他 LRCLIB 歌詞"
        >
        </select>
    </div>

    <!-- ========================================
    歌詞
    ======================================== -->
    <div id="lyrics">
        等待歌曲...
    </div>

    <script src="lyrics.js"></script>
</body>
</html>
