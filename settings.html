<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <title>YTM Lyrics 設定</title>

    <style>
        #colorSetting {
            margin-top: 20px;
            padding: 10px;
        }

        #lyricColor {
            width: 60px;
            height: 35px;
            vertical-align: middle;
            cursor: pointer;
        }
        #fontSizeSetting,
        #lineHeightSetting,
        #fontWeightSetting {
            margin-top: 15px;
            padding: 10px;
        }

        #fontSize,
        #lineHeight {
            vertical-align: middle;
        }

        #fontSizeValue,
        #lineHeightValue {
            display: inline-block;
            min-width: 45px;
            margin-left: 8px;
        }
    </style>

</head>

<body>

    <h1>🎵 YTM Lyrics</h1>

    <p>請選擇你的歌詞資料夾：</p>

    <button id="selectFolder">
        選擇歌詞資料夾
    </button>

    <button
    id="reconnectFolder"
    style="display: none;">
    🔓 重新授權歌詞資料夾
    </button>

    <p id="folderName">
        尚未選擇資料夾
    </p>

    <!-- ========================================
     歌詞顏色設定
     ======================================== -->

    <div id="colorSetting">

        <label for="lyricColor">
            🎨 目前歌詞顏色：
        </label>

        <input
            type="color"
            id="lyricColor"
            value="#ff0000"
        >
    </div>

    <!-- ========================================
     歌詞字體大小
     ======================================== -->

    <div id="fontSizeSetting">

        <label for="fontSize">
            🔤 歌詞字體大小：
        </label>

        <input
            type="range"
            id="fontSize"
            min="12"
            max="36"
            value="18"
        >
        <span id="fontSizeValue">
            18px
        </span>
    </div>

    <!-- ========================================
     歌詞行距
     ======================================== -->

    <div id="lineHeightSetting">

        <label for="lineHeight">
            ↕️ 歌詞行距：
        </label>

        <input
            type="range"
            id="lineHeight"
            min="1"
            max="3"
            step="0.1"
            value="1.6"
        >
        <span id="lineHeightValue">
            1.6
        </span>
    </div>

    <!-- ========================================
     歌詞字體粗細
     ======================================== -->

    <div id="fontWeightSetting">

        <label for="fontWeight">
            🅱️ 歌詞字體粗細：
        </label>

        <select id="fontWeight">

            <option value="400">
                正常
            </option>

            <option value="500">
                稍粗
            </option>

            <option value="600">
                半粗
            </option>

            <option value="700">
                粗體
            </option>
        </select>
    </div>

    <!-- ========================================
     歌詞文字對齊
     ======================================== -->

    <div id="textAlignSetting">

        <label for="textAlign">
            ↔️ 歌詞文字對齊：
        </label>

        <select id="textAlign">

            <option value="left">
                左對齊
            </option>

            <option value="center">
                置中
            </option>

            <option value="right">
                右對齊
            </option>

        </select>

    </div>

    <!-- ========================================
     背景透明度
     ======================================== -->
    <div>
        <label for="backgroundOpacity">
            🌫️ 背景透明度：
        </label>
        
        <input
            id="backgroundOpacity"
            type="range"
            min="0"
            max="100"
            value="100"
        >

        <span id="backgroundOpacityValue">
            100%
        </span>

    </div>

    <hr>

    <h2>歌詞檔案</h2>
    <pre id="fileList">
        尚未讀取歌詞檔案
    </pre>

    <script src="settings.js"></script>
</body>

</html>
