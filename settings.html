<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <title>YTM Lyrics 設定</title>

    <style>
        #colorSetting {
            margin-top: 20px;
            padding: 10px;
        }

        #lyricColor {
            width: 60px;
            height: 35px;
            vertical-align: middle;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h1>🎵 YTM Lyrics</h1>

    <p>請選擇你的歌詞資料夾：</p>

    <button id="selectFolder">
        選擇歌詞資料夾
    </button>

    <button
    id="reconnectFolder"
    style="display: none;">
    🔓 重新授權歌詞資料夾
    </button>

    <p id="folderName">
        尚未選擇資料夾
    </p>

    <!-- ========================================
     歌詞顏色設定
     ======================================== -->

    <div id="colorSetting">

        <label for="lyricColor">
            🎨 目前歌詞顏色：
        </label>

        <input
            type="color"
            id="lyricColor"
            value="#ff0000"
        >

    </div>

    <hr>


    <h2>歌詞檔案</h2>

    <pre id="fileList">
        尚未讀取歌詞檔案
    </pre>


    <script src="settings.js"></script>

</body>

</html>
